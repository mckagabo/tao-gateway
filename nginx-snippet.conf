    # --- TAO gateway: add INSIDE the existing "server { listen 443 ... }" block, above "location / {" ---

    # Exam taking, LTI launches and exam media (audio, images) go straight to TAO, exactly as before. A gateway problem can
    # never interrupt an exam.
    location ~ ^/backoffice/((taoDelivery|taoLti|taoProctoring|taoQtiTest/Runner)/|tao/getFileFlysystem\.php/) {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name assessment.topbrainer.com;
        proxy_ssl_verify off;
        proxy_set_header Host assessment.topbrainer.com;
        proxy_set_header X-Forwarded-Host assessment.topbrainer.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # The rest of the back office goes through the gateway.
    # OFF SWITCH: comment out this whole block and run "nginx -t && systemctl reload nginx".
    location /backoffice/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host assessment.topbrainer.com;
        proxy_set_header X-Forwarded-Host assessment.topbrainer.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 200M;
    }
